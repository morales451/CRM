<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Roof CRM{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#1d4e89">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Roof CRM">
  <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
  <style>
    :root { --brand: #1d4e89; }
    body { background: #f4f6f9; padding-bottom: 4rem; }
    .navbar { background: var(--brand); }
    .navbar .nav-link, .navbar-brand { color: #fff !important; }
    .navbar .nav-link.active { font-weight: 700; text-decoration: underline; }
    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .stat-value { font-size: 1.9rem; font-weight: 700; color: var(--brand); }
    .timeline { border-left: 3px solid #dee2e6; padding-left: 1rem; }
    .timeline-item { margin-bottom: 1rem; position: relative; }
    .timeline-item::before {
      content: ""; position: absolute; left: -1.45rem; top: .35rem;
      width: .75rem; height: .75rem; border-radius: 50%; background: var(--brand);
    }
    .overdue { color: #dc3545; font-weight: 600; }
    td, th { vertical-align: middle; }
    @media (max-width: 576px) {
      .stat-value { font-size: 1.4rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-sm mb-3">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">🏠 Roof CRM</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" style="border-color:#fff">
      <span class="navbar-toggler-icon" style="filter:invert(1)"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'dashboard' }}" href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'accounts' }}" href="{{ url_for('accounts') }}">Accounts</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'pipeline' }}" href="{{ url_for('pipeline') }}">Pipeline</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint in ('projects', 'project_detail') }}" href="{{ url_for('projects') }}">Projects</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'insights' }}" href="{{ url_for('insights') }}">Insights</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'new_account' }}" href="{{ url_for('new_account') }}">+ Add Account</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'templates_page' }}" href="{{ url_for('templates_page') }}">Templates</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'import_page' }}" href="{{ url_for('import_page') }}">Import</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container-fluid px-3" style="max-width: 1100px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show py-2">
        {{ message }}
        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
